name: HeroVerse render (execution runner)
on:
  schedule:
    # nightly chain: images 00:30 UTC (engine), renders from 01:00; each run takes the next pilot of the
    # engine's queue (render_queue.py: publishes within 48 h, images complete, no render for the current script)
    # twice an hour, away from the top of the hour: GitHub delays and drops scheduled runs under load (2026-10-18:
    # one of eight hourly runs fired, 49 min late). An empty queue exits in seconds (public repo, no minute cap);
    # a pilot already rendered for its current script is never rendered again (render_queue.py).
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot directory in the private engine (e.g. pilot-002); empty = the next one in the queue
        required: false
permissions:
  contents: read
concurrency:
  group: heroverse-render
  cancel-in-progress: false
jobs:
  render:
    # only the owner can start it; forks and pull requests never receive the secrets
    # only the owner can start it; forks and pull requests never receive the secrets
    if: github.actor == 'matheusmagah-cpu' && github.repository == 'matheusmagah-cpu/heroverse-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.HERO_ENGINE_PAT }}
      ENGINE_REPO: matheusmagah-cpu/heroverse-engine
      TAG: v0.0.0-cloud-assets-20261013
      INPUT_PILOT: ${{ inputs.pilot }}
      RUN_LABEL: runner ${{ github.run_id }}
      OMP_NUM_THREADS: '4'
      PUBLIC_LOGS: '1'   # public log shows only stage names and pass/fail; details go to a private log
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: matheusmagah-cpu/heroverse-engine
          ref: main
          token: ${{ secrets.HERO_ENGINE_PAT }}
      - name: Pilot (input, or the next one in the engine's queue)
        run: |
          PILOT="$INPUT_PILOT"
          [ -n "$PILOT" ] || PILOT=$(python3 -I -B migration/production/render_queue.py migration/production migration/publish/ledger.json render 48)
          if [ -z "$PILOT" ]; then echo "QUEUE_EMPTY"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          echo "PILOT=$PILOT" >> "$GITHUB_ENV"
      - name: Render, Shorts, QA, package, record (writes back to the private engine)
        if: env.SKIP != '1'
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: bash migration/ci/render_pilot.sh
